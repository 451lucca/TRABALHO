<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda - Academia</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #c62828;
      color: white;
      padding: 10px 15px;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
    }

    .menu-icon {
      font-size: 24px;
      cursor: pointer;
    }

    .topbar-title {
      font-weight: bold;
      font-size: 18px;
      text-align: center;
      flex: 1;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: white;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 60px;
      height: 100%;
      background: #b71c1c;
      padding-top: 60px;
      z-index: 900;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .sidebar a {
      color: white;
      text-decoration: none;
      font-size: 22px;
      padding: 10px;
      border-radius: 8px;
      transition: background 0.2s;
    }

    .sidebar a:hover {
      background: rgba(255,255,255,0.15);
    }

    .content {
      padding: 80px 20px 20px 80px;
      max-width: 1000px;
      margin: 0 auto;
    }

    h2 {
      color: #333;
      margin-bottom: 20px;
    }

    .form-card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 25px;
    }

    .form-card h3 {
      margin-bottom: 15px;
      color: #c62828;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    .form-group label {
      font-size: 14px;
      color: #555;
      margin-bottom: 4px;
      font-weight: bold;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 14px;
      font-family: Arial, sans-serif;
      transition: border-color 0.2s;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #c62828;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 60px;
    }

    .form-actions {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }

    .btn {
      border: none;
      padding: 10px 24px;
      font-size: 14px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    .btn-primary {
      background: #c62828;
      color: white;
    }

    .btn-primary:hover {
      background: #a31515;
    }

    .btn-secondary {
      background: #757575;
      color: white;
    }

    .btn-secondary:hover {
      background: #616161;
    }

    .btn-danger {
      background: #d32f2f;
      color: white;
      padding: 6px 14px;
      font-size: 13px;
    }

    .btn-danger:hover {
      background: #b71c1c;
    }

    .btn-edit {
      background: #f57c00;
      color: white;
      padding: 6px 14px;
      font-size: 13px;
    }

    .btn-edit:hover {
      background: #e65100;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    thead {
      background: #c62828;
      color: white;
    }

    th, td {
      padding: 12px 15px;
      text-align: left;
      font-size: 14px;
    }

    tbody tr {
      border-bottom: 1px solid #eee;
      transition: background 0.15s;
    }

    tbody tr:hover {
      background: #fce4ec;
    }

    .status-agendado {
      color: #1565c0;
      font-weight: bold;
    }

    .status-concluido {
      color: #2e7d32;
      font-weight: bold;
    }

    .status-cancelado {
      color: #c62828;
      font-weight: bold;
    }

    .acoes {
      display: flex;
      gap: 6px;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: #999;
      font-size: 16px;
    }

    @media (max-width: 700px) {
      .content {
        padding: 80px 10px 10px 70px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      table {
        font-size: 12px;
      }

      th, td {
        padding: 8px 10px;
      }

      .acoes {
        flex-direction: column;
      }
    }

    @media (max-width: 400px) {
      .topbar-title {
        font-size: 16px;
      }

      .content {
        padding: 80px 8px 8px 68px;
      }
    }
  </style>
</head>
<body>

  <!-- Barra superior -->
  <div class="topbar">
    <span class="menu-icon">☰</span>
    <div class="topbar-title">AGENDA</div>
    <div class="avatar"></div>
  </div>

  <!-- Menu lateral -->
  <div class="sidebar">
    <a href="/index.html" title="Prova">📝</a>
    <a href="/agenda.html" title="Agenda">📅</a>
  </div>

  <!-- Conteúdo -->
  <div class="content">
    <h2>📅 Agenda da Academia</h2>

    <!-- Formulário -->
    <div class="form-card" id="formCard">
      <h3 id="formTitle">Novo Agendamento</h3>
      <input type="hidden" id="agendaId">
      <div class="form-grid">
        <div class="form-group">
          <label for="titulo">Título</label>
          <input type="text" id="titulo" placeholder="Ex: Treino funcional">
        </div>
        <div class="form-group">
          <label for="nomeAluno">Nome do Aluno</label>
          <input type="text" id="nomeAluno" placeholder="Ex: João Silva">
        </div>
        <div class="form-group">
          <label for="atividade">Atividade</label>
          <select id="atividade">
            <option value="Musculação">Musculação</option>
            <option value="Crossfit">Crossfit</option>
            <option value="Yoga">Yoga</option>
            <option value="Natação">Natação</option>
            <option value="Pilates">Pilates</option>
            <option value="Funcional">Funcional</option>
            <option value="Dança">Dança</option>
            <option value="Outro">Outro</option>
          </select>
        </div>
        <div class="form-group">
          <label for="dataHora">Data e Hora</label>
          <input type="datetime-local" id="dataHora">
        </div>
        <div class="form-group">
          <label for="status">Status</label>
          <select id="status">
            <option value="Agendado">Agendado</option>
            <option value="Concluído">Concluído</option>
            <option value="Cancelado">Cancelado</option>
          </select>
        </div>
        <div class="form-group full-width">
          <label for="descricao">Descrição</label>
          <textarea id="descricao" placeholder="Observações..."></textarea>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" onclick="salvar()">Salvar</button>
        <button class="btn btn-secondary" onclick="cancelarEdicao()" id="btnCancelar" style="display:none;">Cancelar</button>
      </div>
    </div>

    <!-- Tabela -->
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Título</th>
          <th>Aluno</th>
          <th>Atividade</th>
          <th>Data/Hora</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="tabelaBody">
        <tr>
          <td colspan="7" class="empty-state">Carregando...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    const API = '/api/agendas';

    async function carregarAgendas() {
      try {
        const res = await fetch(API);
        const agendas = await res.json();
        const tbody = document.getElementById('tabelaBody');

        if (agendas.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" class="empty-state">Nenhum agendamento encontrado.</td></tr>';
          return;
        }

        tbody.innerHTML = agendas.map(a => {
          const dt = new Date(a.dataHora);
          const dataFormatada = dt.toLocaleDateString('pt-BR') + ' ' + dt.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
          const statusClass = a.status === 'Agendado' ? 'status-agendado'
            : a.status === 'Concluído' ? 'status-concluido'
            : 'status-cancelado';

          return `<tr>
            <td>${a.id}</td>
            <td>${a.titulo}</td>
            <td>${a.nomeAluno}</td>
            <td>${a.atividade}</td>
            <td>${dataFormatada}</td>
            <td class="${statusClass}">${a.status}</td>
            <td class="acoes">
              <button class="btn btn-edit" onclick="editar(${a.id})">Editar</button>
              <button class="btn btn-danger" onclick="deletar(${a.id})">Excluir</button>
            </td>
          </tr>`;
        }).join('');
      } catch (err) {
        document.getElementById('tabelaBody').innerHTML =
          '<tr><td colspan="7" class="empty-state">Erro ao carregar agendas.</td></tr>';
      }
    }

    async function salvar() {
      const id = document.getElementById('agendaId').value;
      const agenda = {
        titulo: document.getElementById('titulo').value,
        descricao: document.getElementById('descricao').value,
        dataHora: document.getElementById('dataHora').value,
        nomeAluno: document.getElementById('nomeAluno').value,
        atividade: document.getElementById('atividade').value,
        status: document.getElementById('status').value
      };

      if (!agenda.titulo || !agenda.nomeAluno || !agenda.dataHora) {
        alert('Preencha os campos obrigatórios: Título, Nome do Aluno e Data/Hora.');
        return;
      }

      try {
        const url = id ? `${API}/${id}` : API;
        const method = id ? 'PUT' : 'POST';

        await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(agenda)
        });

        limparFormulario();
        carregarAgendas();
      } catch (err) {
        alert('Erro ao salvar agendamento.');
      }
    }

    async function editar(id) {
      try {
        const res = await fetch(`${API}/${id}`);
        const a = await res.json();

        document.getElementById('agendaId').value = a.id;
        document.getElementById('titulo').value = a.titulo;
        document.getElementById('descricao').value = a.descricao || '';
        document.getElementById('nomeAluno').value = a.nomeAluno;
        document.getElementById('atividade').value = a.atividade;
        document.getElementById('status').value = a.status;

        const dt = new Date(a.dataHora);
        const iso = dt.getFullYear() + '-' +
          String(dt.getMonth()+1).padStart(2,'0') + '-' +
          String(dt.getDate()).padStart(2,'0') + 'T' +
          String(dt.getHours()).padStart(2,'0') + ':' +
          String(dt.getMinutes()).padStart(2,'0');
        document.getElementById('dataHora').value = iso;

        document.getElementById('formTitle').textContent = 'Editar Agendamento';
        document.getElementById('btnCancelar').style.display = 'inline-block';
        document.getElementById('formCard').scrollIntoView({ behavior: 'smooth' });
      } catch (err) {
        alert('Erro ao carregar agendamento.');
      }
    }

    async function deletar(id) {
      if (!confirm('Deseja realmente excluir este agendamento?')) return;
      try {
        await fetch(`${API}/${id}`, { method: 'DELETE' });
        carregarAgendas();
      } catch (err) {
        alert('Erro ao excluir agendamento.');
      }
    }

    function cancelarEdicao() {
      limparFormulario();
    }

    function limparFormulario() {
      document.getElementById('agendaId').value = '';
      document.getElementById('titulo').value = '';
      document.getElementById('descricao').value = '';
      document.getElementById('dataHora').value = '';
      document.getElementById('nomeAluno').value = '';
      document.getElementById('atividade').value = 'Musculação';
      document.getElementById('status').value = 'Agendado';
      document.getElementById('formTitle').textContent = 'Novo Agendamento';
      document.getElementById('btnCancelar').style.display = 'none';
    }

    carregarAgendas();
  </script>
</body>
</html>
