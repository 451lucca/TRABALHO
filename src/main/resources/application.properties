# ===================================================================
# Application Security Configuration
# ===================================================================

# Disable H2 Console in production — it allows arbitrary SQL execution.
# Set to true ONLY for local development when needed.
spring.h2.console.enabled=false

# Database — credentials should come from environment variables, not hardcoded values.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:academia}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Do not expose internal error details to clients.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
